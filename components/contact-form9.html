  <body>
    <link rel="stylesheet" href="../style.css" />
    <div>
      <link href="./contact-form9.css" rel="stylesheet" />
      <div class="contact-form9-contact11 thq-section-padding">
        <div class="contact-form9-max-width thq-section-max-width">
          <div class="contact-form9-section-title thq-card">
            <div class="contact-form9-content1">
              <h2>
                <fragment class="contact-form9-fragment2">
                  <h2 class="contact-form9-text21 thq-heading-2">
                    Me contacter
                  </h2>
                </fragment>
              </h2>
              <p>
                <fragment class="contact-form9-fragment3"></fragment>
              </p>
              <p class="contact-form9-text22 thq-body-large">
                Besoin specifique ? Une question ? N'hesitez pas a me contacter
                pour plus d'info
              </p>

              <p></p>
            </div>
          </div>
          <div class="contact-form9-content2">
            <form class="contact-form9-form thq-card">
              <div class="contact-form9-input1">
                <label for="contact-form-9-name" class="thq-body-small">
                  Nom
                </label>
                <input
                  type="text"
                  id="contact-form-9-name"
                  placeholder="Full Name"
                  class="thq-input"
                />
              </div>
              <div class="contact-form9-input2">
                <label for="contact-form-9-email" class="thq-body-small">
                  Email
                </label>
                <input
                  type="text"
                  id="contact-form-9-email"
                  required="true"
                  placeholder="Email"
                  class="thq-input"
                />
              </div>
              <div class="contact-form9-container">
                <div class="contact-form9-input3">
                  <label for="contact-form-9-options" class="thq-body-small">
                    Choisir un sujet
                  </label>
                  <select
                    id="contact-form-9-options"
                    placeholder="Select one"
                    class="thq-select"
                  >
                    <option value="Option 1">Devis</option>
                    <option value="Option 1">Reclamation</option>
                    <option value="Option 1">Information</option>
                    <option value="Option 2">Autres</option>
                  </select>
                </div>
              </div>
              <div class="contact-form9-input4">
                <label for="contact-form-9-message" class="thq-body-small">
                  Message
                </label>
                <textarea
                  id="contact-form-9-message"
                  rows="3"
                  placeholder="Enter your message"
                  class="thq-input"
                ></textarea>
              </div>
              <div class="contact-form9-checkbox1">
                <input
                  type="checkbox"
                  id="contact-form-9-check"
                  checked="true"
                  required="true"
                  class="thq-checkbox"
                />
                <label for="contact-form-9-check" class="thq-body-small">
                  I accept the Terms
                </label>
              </div>
              <button type="submit" class="thq-button-filled">
                <span>
                  <fragment class="contact-form9-fragment4">
                    <span class="contact-form9-text23 thq-body-small">
                      Submit
                    </span>
                  </fragment>
                </span>
              </button>
            </form>
            <div class="contact-form9-content3 thq-card">
              <div class="contact-form9-row1 thq-flex-row">
                <div class="contact-form9-content4">
                  <svg
                    viewBox="0 0 1024 1024"
                    class="contact-form9-icon1 thq-icon-small"
                  >
                    <path
                      d="M854 342v-86l-342 214-342-214v86l342 212zM854 170q34 0 59 26t25 60v512q0 34-25 60t-59 26h-684q-34 0-59-26t-25-60v-512q0-34 25-60t59-26h684z"
                    ></path>
                  </svg>
                  <div class="contact-form9-contact-info">
                    <h3 class="thq-heading-3">Email</h3>
                    <span>
                      <fragment class="contact-form9-fragment1">
                        <span class="contact-form9-text18 thq-body-small">
                          <span>contact@melaniephoto.fr</span>
                          <br />
                        </span>
                      </fragment>
                    </span>
                  </div>
                </div>
                <div class="contact-form9-content5"></div>
              </div>
              <div class="thq-flex-row contact-form9-row2">
                <img
                  alt="image"
                  src="public/81339768_1673524286121010_3021586059117985792_n-1400w.jpg"
                  class="contact-form9-image thq-img-ratio-1-1"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
